name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-release
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/pr.yaml
  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Read release version
        id: version
        run: echo "smw=$(sed -n 's/^ARG SMW_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            naimkabir/semantic-mediawiki:${{ steps.version.outputs.smw }}
            naimkabir/semantic-mediawiki:latest
      - name: Publish demo
        uses: docker/build-push-action@v6
        with:
          context: .
          target: demo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            naimkabir/semantic-mediawiki:${{ steps.version.outputs.smw }}-demo
            naimkabir/semantic-mediawiki:demo
